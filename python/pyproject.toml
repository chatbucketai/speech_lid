[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lid9"
version = "1.0.0"
description = "Spoken language identification for 9 Indian languages"
requires-python = ">=3.8"
dependencies = ["onnxruntime>=1.17", "numpy>=1.21"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]

[project.scripts]
lid9 = "lid9.cli:main"

[tool.setuptools]
packages = ["lid9"]

[tool.setuptools.package-data]
lid9 = ["models/*.onnx"]
